<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Credencial Oficial</title>

    <!-- Leitor de QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <!-- Gerador de QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        h2 {
            margin-bottom: 16px;
            font-size: 1.2rem;
            text-align: center;
            color: #1e3a8a;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #1e3a8a;
        }

        .input-inline-group {
            display: flex;
            gap: 8px;
        }

        .input-inline-group input {
            flex: 1;
            min-width: 0;
        }

        .btn-inline {
            padding: 0 16px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .disclaimer-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 15px 0;
            font-size: 0.85rem;
            line-height: 1.3;
        }

        .disclaimer-group input {
            margin-top: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .disclaimer-group label {
            margin: 0;
            font-weight: 400;
            font-size: 0.85rem;
        }

        .disclaimer-group a {
            color: #1e3a8a;
            text-decoration: underline;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-scan {
            background-color: #475569;
            margin-bottom: 10px;
        }

        #status {
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 4px;
            color: #dc2626;
            word-break: break-word;
        }

        #status.success {
            color: #16a34a;
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
        }

        /*
         * Canvas de visualização.
         *
         * O canvas real é 680x1080, mas será mostrado
         * na tela com 340x540.
         */
        #snapshot-canvas {
            width: 340px;
            height: 540px;
            display: block;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        #download-btn {
            margin-top: 15px;
            width: 340px;
            background-color: #10b981;
        }

        /*
         * Container invisível usado somente para gerar
         * o QR Code.
         */
        #qr-generator {
            position: absolute;
            left: -10000px;
            top: -10000px;
            width: 175px;
            height: 175px;
            background: #ffffff;
        }

        @media (max-width: 380px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            #snapshot-canvas,
            #download-btn {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         PAINEL
         ========================================================= -->

    <div class="container">

        <h2>Painel do Crachá</h2>

        <!-- Câmera -->
        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            style="display:none;"
        >

        <button
            class="btn-action btn-scan"
            id="cameraButton"
            type="button"
        >
            📸 Tirar Foto do QR Code (ID)
        </button>


        <!-- ID manual -->

        <div
            class="form-group"
            style="margin-top:5px;"
        >

            <label for="manualIdInput">
                Ou insira o ID Manualmente:
            </label>

            <div class="input-inline-group">

                <input
                    type="text"
                    id="manualIdInput"
                    placeholder="Digite o ID"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="btn-inline"
                    id="inserirIdBtn"
                >
                    Inserir
                </button>

            </div>

        </div>


        <!-- Status -->

        <p id="status">
            Nenhum QR Code lido
        </p>


        <!-- Nome -->

        <div
            class="form-group"
            style="margin-top:12px;"
        >

            <label for="nomeInput">
                Nome do Profissional:
            </label>

            <input
                type="text"
                id="nomeInput"
                placeholder="Seu Nome"
                autocomplete="name"
            >

        </div>


        <!-- Termos -->

        <div class="disclaimer-group">

            <input
                type="checkbox"
                id="termosCheckbox"
            >

            <label for="termosCheckbox">

                Estou ciente e aceito os

                <a
                    href="termos.html"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Termos e Condições de Uso
                </a>

                estabelecidos.

            </label>

        </div>


        <!-- Gerar -->

        <button
            class="btn-action"
            id="gerar-btn"
            type="button"
        >
            Visualizar Credencial
        </button>

    </div>


    <!-- =========================================================
         CANVAS DE PRÉ-VISUALIZAÇÃO
         ========================================================= -->

    <div
        class="preview-container"
        id="preview-section"
        style="display:none;"
    >

        <canvas
            id="snapshot-canvas"
            width="680"
            height="1080"
        ></canvas>


        <button
            class="btn-action"
            id="download-btn"
            type="button"
        >
            📥 Baixar Imagem do Crachá
        </button>

    </div>


    <!-- =========================================================
         GERADOR INVISÍVEL DO QR CODE
         ========================================================= -->

    <div id="qr-generator"></div>


    <script>

         * =========================================================
         * CONFIGURAÇÕES
         * =========================================================

         *
         * Agora usamos 2x:
         *
         * 680 x 1080
         *
         * Isso deixa a imagem muito mais nítida.

        /*
         * =========================================================
         * ATUALIZA NOME
         * =========================================================
         */

        function atualizarNome() {

            /*
             * Essa função só mantém o comportamento
             * visual do formulário.
             *
             * O nome real será desenhado no Canvas
             * somente quando gerar a credencial.
             */

        }


        nomeInput.addEventListener(
            "input",
            atualizarNome
        );


        /*
         * =========================================================
         * CÂMERA
         * =========================================================
         */

        cameraButton.addEventListener(
            "click",
            function () {

                /*
                 * Permite selecionar/tirar novamente
                 * a mesma foto.
                 */

                cameraInput.value = "";

                cameraInput.click();

            }
        );


        /*
         * =========================================================
         * ID MANUAL
         * =========================================================
         */

        inserirIdBtn.addEventListener(
            "click",
            function () {

                const valorManual =
                    manualIdInput.value.trim();


                if (!valorManual) {

                    alert(
                        "Por favor, insira um código válido."
                    );

                    return;
                }


                const confirmar =
                    confirm(
                        "ID adicionado manualmente. Apenas utilize seu ID/Prontuário.\n\n" +
                        "Ao adicionar ID manualmente você assume que os dados fornecidos são seus; " +
                        "o mau uso dessa opção pode acarretar em prejuízos a você."
                    );


                if (!confirmar) {

                    manualIdInput.value = "";

                    return;
                }


                idDetectado =
                    valorManual;


                statusText.classList.add(
                    "success"
                );


                statusText.innerText =
                    "✓ ID Manual Registrado: " +
                    idDetectado;

            }
        );


        /*
         * =========================================================
         * LEITURA DO QR CODE
         * =========================================================
         */

        cameraInput.addEventListener(
            "change",
            async function (e) {

                if (
                    !e.target.files ||
                    e.target.files.length === 0
                ) {
                    return;
                }


                const file =
                    e.target.files[0];


                statusText.classList.remove(
                    "success"
                );


                statusText.innerText =
                    "Lendo código...";


                manualIdInput.value = "";


                try {

                    const decodedText =
                        await html5QrCode.scanFile(
                            file,
                            true
                        );


                    idDetectado =
                        decodedText.trim();


                    if (!idDetectado) {

                        throw new Error(
                            "QR Code vazio."
                        );

                    }


                    statusText.classList.add(
                        "success"
                    );


                    statusText.innerText =
                        "✓ ID Carregado!";


                } catch (error) {

                    console.error(
                        "Erro ao ler QR Code:",
                        error
                    );


                    statusText.classList.remove(
                        "success"
                    );


                    statusText.innerText =
                        "❌ Centralize melhor o QR Code e tire outra foto.";

                }

            }
        );


        /*
         * =========================================================
         * CARREGAR LOGO
         * =========================================================
         */

        function carregarImagem(src) {

            return new Promise(
                function (resolve, reject) {

                    const img =
                        new Image();


                    img.onload =
                        function () {

                            resolve(img);

                        };


                    img.onerror =
                        function () {

                            reject(
                                new Error(
                                    "Não foi possível carregar a logo."
                                )
                            );

                        };


                    img.src = src;

                }
            );

        }


        /*
         * =========================================================
         * CENTRALIZAR TEXTO
         * =========================================================
         */

        function desenharTextoCentralizado(
            contexto,
            texto,
            x,
            y,
            maxWidth
        ) {

            contexto.textAlign = "center";
            contexto.textBaseline = "middle";

            contexto.fillText(
                texto,
                x,
                y,
                maxWidth
            );

        }


        /*
         * =========================================================
         * QUEBRAR NOME GRANDE
         * =========================================================
         *
         * Evita que nomes muito grandes saiam
         * para fora do crachá.
         */

        function ajustarFonteNome(
            texto,
            fonteBase,
            larguraMaxima
        ) {

            let tamanho =
                fonteBase;


            ctx.font =
                `700 ${tamanho}px Arial`;


            while (
                ctx.measureText(texto).width >
                    larguraMaxima &&
                tamanho > 28
            ) {

                tamanho -= 2;


                ctx.font =
                    `700 ${tamanho}px Arial`;

            }


            return tamanho;

        }


        /*
         * =========================================================
         * GERAR QR CODE
         * =========================================================
         */

        function gerarQRCode(id) {

            return new Promise(
                function (resolve, reject) {

                    try {

                        qrGenerator.innerHTML = "";


                        new QRCode(
                            qrGenerator,
                            {
                                text: String(id),

                                width: 350,
                                height: 350,

                                colorDark: "#000000",
                                colorLight: "#ffffff",

                                correctLevel:
                                    QRCode.CorrectLevel.H
                            }
                        );


                        /*
                         * O qrcodejs pode criar Canvas
                         * ou IMG dependendo do navegador.
                         *
                         * Esperamos alguns milissegundos
                         * e verificamos.
                         */

                        setTimeout(
                            function () {

                                const qrCanvas =
                                    qrGenerator.querySelector(
                                        "canvas"
                                    );


                                if (qrCanvas) {

                                    resolve(
                                        qrCanvas
                                    );

                                    return;

                                }


                                const qrImg =
                                    qrGenerator.querySelector(
                                        "img"
                                    );


                                if (qrImg) {

                                    if (
                                        qrImg.complete &&
                                        qrImg.naturalWidth > 0
                                    ) {

                                        resolve(
                                            qrImg
                                        );

                                        return;

                                    }


                                    qrImg.onload =
                                        function () {

                                            resolve(
                                                qrImg
                                            );

                                        };


                                    qrImg.onerror =
                                        function () {

                                            reject(
                                                new Error(
                                                    "Não foi possível carregar o QR Code."
                                                )
                                            );

                                        };


                                    return;

                                }


                                reject(
                                    new Error(
                                        "QR Code não foi criado."
                                    )
                                );

                            },
                            150
                        );

                    } catch (error) {

                        reject(error);

                    }

                }
            );

        }

                logo =
                    await carregarImagem(
                        LOGO_BASE64
                    );

            } catch (error) {

                console.error(
                    "Erro ao carregar logo:",
                    error
                );

                /*
                 * Não interrompe a geração.
                 *
                 * Se a logo estiver errada,
                 * o restante do crachá ainda será gerado.
                 */

                logo = null;

            }


            if (logo) {

                /*
                 * Área original:
                 *
                 * x = 25
                 * y = 25
                 * largura = 290
                 * altura = 55
                 *
                 * Multiplicada por 2.
                 */

                const areaX =
                    25 * SCALE;

                const areaY =
                    25 * SCALE;

                const areaW =
                    290 * SCALE;

                const areaH =
                    55 * SCALE;


                /*
                 * Mantém proporção da logo.
                 */

                const proporcao =
                    Math.min(
                        areaW / logo.width,
                        areaH / logo.height
                    );


                const logoW =
                    logo.width * proporcao;

                const logoH =
                    logo.height * proporcao;


                const logoX =
                    areaX +
                    (areaW - logoW) / 2;


                const logoY =
                    areaY +
                    (areaH - logoH) / 2;


                ctx.drawImage(
                    logo,
                    logoX,
                    logoY,
                    logoW,
                    logoH
                );

            }


            /*
             * =====================================================
             * TEXTOS
             * =====================================================
             */

            /*
             * "PROFISSIONAL"
             */

            ctx.fillStyle =
                "#000000";


            ctx.font =
                "700 20px Arial";


            desenharTextoCentralizado(
                ctx,
                "PROFISSIONAL",
                340,
                160,
                600
            );


            /*
             * NOME
             */

            const nomeMaiusculo =
                nome.toUpperCase();


            const tamanhoNome =
                ajustarFonteNome(
                    nomeMaiusculo,
                    48,
                    600
                );


            ctx.font =
                `700 ${tamanhoNome}px Arial`;


            ctx.fillStyle =
                "#000000";


            desenharTextoCentralizado(
                ctx,
                nomeMaiusculo,
                340,
                205,
                600
            );


            /*
             * ID
             */

            ctx.font =
                "700 20px Arial";


            desenharTextoCentralizado(
                ctx,
                "ID",
                340,
                270,
                600
            );


            /*
             * Número do ID
             */

            ctx.font =
                "700 54px Arial";


            desenharTextoCentralizado(
                ctx,
                String(id),
                340,
                315,
                620
            );


            /*
             * =====================================================
             * QR CODE
             * =====================================================
             */

            statusText.innerText =
                "Gerando QR Code...";


            const qr =
                await gerarQRCode(id);


            /*
             * QR Code original:
             *
             * 175 x 175
             *
             * Agora:
             *
             * 350 x 350
             */

            const qrSize =
                350;


            const qrX =
                (CANVAS_WIDTH - qrSize) / 2;


            /*
             * Mantemos o QR aproximadamente
             * na mesma posição do seu layout original.
             */

            const qrY =
                430;


            /*
             * Fundo branco atrás do QR.
             */

            ctx.fillStyle =
                "#ffffff";


            ctx.fillRect(
                qrX,
                qrY,
                qrSize,
                qrSize
            );


            ctx.drawImage(
                qr,
                qrX,
                qrY,
                qrSize,
                qrSize
            );


            /*
             * =====================================================
             * BARRA COLORIDA INFERIOR
             * =====================================================
             */

            const barraY =
                1052;


            const barraH =
                28;


            const larguraSegmento =
                CANVAS_WIDTH / 6;


            const cores = [
                "#fde047",
                "#eab308",
                "#004691",
                "#38bdf8",
                "#047857",
                "#86efac"
            ];


            for (
                let i = 0;
                i < 6;
                i++
            ) {

                ctx.fillStyle =
                    cores[i];


                ctx.fillRect(
                    i * larguraSegmento,
                    barraY,
                    larguraSegmento + 1,
                    barraH
                );

            }


            /*
             * =====================================================
             * FINAL
             * =====================================================
             */

            /*
             * Converte para PNG.
             */

            const dataUrl =
                canvas.toDataURL(
                    "image/png",
                    1.0
                );


            if (
                !dataUrl ||
                dataUrl.length < 100
            ) {

                throw new Error(
                    "O navegador não conseguiu criar a imagem."
                );

            }


            return dataUrl;

        }


        /*
         * =========================================================
         * BOTÃO GERAR
         * =========================================================
         */

        gerarBtn.addEventListener(
            "click",
            async function () {

                const nome =
                    nomeInput.value.trim();


                /*
                 * Termos
                 */

                if (
                    !termosCheckbox.checked
                ) {

                    alert(
                        "Você precisa aceitar os Termos e Condições de Uso para prosseguir."
                    );

                    return;
                }


                /*
                 * Nome
                 */

                if (!nome) {

                    alert(
                        "Digite o nome antes."
                    );

                    nomeInput.focus();

                    return;
                }


                /*
                 * ID
                 */

                if (!idDetectado) {

                    alert(
                        "Forneça um ID válido através da foto ou inserção manual."
                    );

                    return;
                }


                try {

                    gerarBtn.disabled =
                        true;


                    statusText.classList.remove(
                        "success"
                    );


                    statusText.innerText =
                        "Preparando credencial...";


                    /*
                     * Desenha tudo diretamente
                     * no Canvas.
                     */

                    imagemUrlPronta =
                        await desenharCredencial(
                            nome,
                            idDetectado
                        );


                    /*
                     * Mostra o Canvas.
                     */

                    previewSection.style.display =
                        "flex";


                    statusText.classList.add(
                        "success"
                    );


                    statusText.innerText =
                        "✓ Credencial gerada!";


                    /*
                     * Rola até a credencial.
                     */

                    setTimeout(
                        function () {

                            previewSection.scrollIntoView(
                                {
                                    behavior: "smooth",
                                    block: "start"
                                }
                            );

                        },
                        100
                    );


                } catch (error) {

                    console.error(
                        "ERRO AO GERAR CREDENCIAL:",
                        error
                    );


                    const mensagem =
                        error?.message ||
                        String(error);


                    alert(
                        "Erro ao gerar a credencial:\n\n" +
                        mensagem
                    );


                    statusText.classList.remove(
                        "success"
                    );


                    statusText.innerText =
                        "❌ Erro ao gerar.";


                } finally {

                    gerarBtn.disabled =
                        false;

                }

            }
        );


        /*
         * =========================================================
         * DOWNLOAD / SALVAR
         * =========================================================
         */

        downloadBtn.addEventListener(
            "click",
            function () {

                if (!imagemUrlPronta) {

                    alert(
                        "Gere a credencial antes de tentar baixar."
                    );

                    return;
                }


                const nome =
                    nomeInput.value
                        .trim()
                        .toUpperCase();


                const nomeParaArquivo =
                    nome
                        ? nome.replace(
                            /[^\p{L}\p{N}]+/gu,
                            "_"
                        )
                        : "CREDENCIAL";


                /*
                 * Abre nova aba.
                 */

                const novaAba =
                    window.open(
                        "",
                        "_blank"
                    );


                if (!novaAba) {

                    alert(
                        "Permita pop-ups no navegador para salvar a imagem."
                    );

                    return;
                }


                /*
                 * Página de salvamento.
                 */

                novaAba.document.open();


                novaAba.document.write(
                    `
                    <!DOCTYPE html>

                    <html lang="pt-BR">

                    <head>

                        <meta charset="UTF-8">

                        <meta
                            name="viewport"
                            content="width=device-width, initial-scale=1"
                        >

                        <title>
                            ${nomeParaArquivo}
                        </title>

                        <style>

                            * {
                                box-sizing: border-box;
                            }

                            body {

                                margin: 0;

                                padding: 16px;

                                background: #f1f5f9;

                                text-align: center;

                                font-family:
                                    Arial,
                                    sans-serif;

                            }

                            img {

                                display: block;

                                width: 680px;

                                max-width: 100%;

                                height: auto;

                                margin:
                                    0 auto 16px auto;

                                background:
                                    #ffffff;

                            }

                            p {

                                color:
                                    #334155;

                                font-size:
                                    15px;

                                line-height:
                                    1.4;

                            }

                        </style>

                    </head>

                    <body>

                        <img
                            src="${imagemUrlPronta}"
                            alt="Credencial"
                        >

                        <p>
                            Pressione e segure a imagem
                            para salvar a credencial.
                        </p>

                    </body>

                    </html>
                    `
                );


                novaAba.document.close();

            }
        );

    </script>

</body>
